name: CI & Netlify Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  push:
    branches: [master] # prod deploys

permissions:
  contents: read
  statuses: write

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI + Babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            m2-

      - name: Format check
        run: bb fmt-check

      - name: Tests (JVM + CLJS headless)
        run: bb test-ci

  preview_deploy:
    name: Netlify Deploy (Preview)
    needs: build_test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            m2-

      - name: Build site (dist/)
        run: bb dist

      - name: Netlify deploy (preview)
        id: deploy
        uses: netlify/actions/cli@v4
        with:
          args: >
            deploy
            --dir=dist
            --alias=pr-${{ github.event.pull_request.number }}
            --message="PR #${{ github.event.pull_request.number }} ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Compose preview URL
        id: url
        run: |
          alias="pr-${{ github.event.pull_request.number }}"
          echo "url=https://${alias}--loicblanchard.netlify.app" >> "$GITHUB_OUTPUT"

      - run: echo "Preview → ${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY

      - name: Status check (link to preview)
        if: github.event.pull_request.head.repo.fork == false
        uses: Sibz/github-status-action@v1.1.1
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: Netlify preview
          state: success
          target_url: ${{ steps.url.outputs.url }}

  prod_deploy:
    name: Netlify Deploy (Production)
    needs: build_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            m2-

      - name: Build site (dist/)
        run: bb dist

      - name: Netlify deploy (prod)
        uses: netlify/actions/cli@v4
        with:
          args: deploy --dir=dist --prod --message="Prod ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
